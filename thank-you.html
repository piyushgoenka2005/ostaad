<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="ostaad-logo.png"><link rel="stylesheet" href="cookie-consent.css">
  <style>:root{--paper:#faf7f4;--surface:#fdfbf9;--slate:#23384f;--taupe:#b8a18b;--text:#625f59;--terracotta:#a87545;--line:#eae4de;--mono:'Courier New',monospace}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:120px 24px 24px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 10%,#fff,transparent 35%),var(--paper);color:var(--slate);font-family:Arial,sans-serif;}
/* Full floating desktop nav */
.nav-wrap{position:fixed;top:16px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 16px;}
.site-nav{width:min(980px,100%);display:flex;align-items:center;gap:20px;padding:10px 12px 10px 20px;border:1px solid var(--line);border-radius:16px;background:rgba(253,251,249,.92);backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(35,56,79,.08);}
.nav-logo{display:inline-flex;align-items:center;gap:9px;color:var(--slate);font-size:15px;letter-spacing:.01em;text-decoration:none;white-space:nowrap;font-weight:600;}
.nav-logo-mark{width:25px;height:25px;overflow:hidden;border-radius:6px;}
.nav-logo-mark img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.78);}
.nav-links{display:flex;align-items:center;justify-content:center;flex:1;gap:clamp(16px,2.5vw,28px);margin:0;padding:0;list-style:none;}
.nav-links a{font-size:13px;color:var(--text);text-decoration:none;white-space:nowrap;font-family:Arial,sans-serif;transition:color .2s;}
.nav-links a:hover{color:var(--terracotta);}
.nav-cta{display:flex;align-items:center;gap:10px;}
.nav-secondary{font-size:13px;color:var(--text);text-decoration:none;white-space:nowrap;transition:color .2s;}
.nav-secondary:hover{color:var(--terracotta);}
.nav-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--slate);color:#fff;text-decoration:none;font:11px var(--mono);white-space:nowrap;letter-spacing:.04em;transition:background .2s;}
.nav-btn:hover{background:#31465f;}
.menu-toggle{display:none;border:0;background:none;color:var(--slate);font-size:20px;cursor:pointer;padding:4px 8px;}
.card{width:min(670px,100%);padding:clamp(34px,7vw,76px);border:1px solid #eae4de;border-radius:28px;background:rgba(253,251,249,.76);box-shadow:0 24px 70px rgba(35,56,79,.11);text-align:center}.brand{display:inline-flex;align-items:center;gap:9px;color:inherit;text-decoration:none;font-size:14px;letter-spacing:.08em}.brand-mark{width:30px;height:30px;overflow:hidden;border-radius:7px}.brand-mark img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.78)}.eyebrow{margin-top:58px;color:var(--taupe);font:11px var(--mono);letter-spacing:.15em}h1{margin:20px 0;font-size:clamp(44px,8vw,78px);line-height:.95;letter-spacing:-.07em;font-weight:500}p{max-width:440px;margin:0 auto;color:var(--text);font-size:17px;line-height:1.65}.button{display:inline-flex;gap:12px;align-items:center;margin-top:34px;padding:14px 18px;border-radius:11px;background:var(--slate);color:#fff;text-decoration:none;font:12px var(--mono)}
@media(max-width:768px){.nav-links,.nav-secondary{display:none;}.nav-links.open{position:absolute;top:62px;left:0;right:0;display:flex;flex-direction:column;align-items:stretch;gap:0;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(253,251,249,.96);box-shadow:0 8px 24px rgba(35,56,79,.1);}.nav-links.open li{padding:10px 0;border-bottom:1px solid var(--line);}.nav-links.open li:last-child{border-bottom:0;}.menu-toggle{display:block;margin-left:auto;}.site-nav{position:relative;}}
/* Mobile nav */
.mobile-nav{display:none;}
@media(max-width:768px){body{padding-bottom:96px;}.mobile-nav{display:flex;position:fixed;bottom:14px;left:14px;right:14px;z-index:100;background:rgba(253,251,249,.94);backdrop-filter:blur(22px);border:1px solid #eae4de;border-radius:18px;box-shadow:0 14px 34px rgba(35,56,79,.15);padding:8px 4px;justify-content:space-around;align-items:stretch;overflow-x:auto;scrollbar-width:none;}.mobile-nav::-webkit-scrollbar{display:none;}.mobile-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9.5px;color:var(--taupe);flex:1 0 52px;min-height:48px;padding:4px 2px;border-radius:12px;text-decoration:none;transition:color .2s,background .2s;font-family:var(--mono);}.mobile-nav a svg{width:18px;height:18px;stroke:var(--taupe);fill:none;stroke-width:1.5;transition:stroke .2s;}.mobile-nav a:hover{color:var(--slate);background:rgba(35,56,79,.06);}.mobile-nav a:hover svg{stroke:var(--slate);}}</style>
</head>
